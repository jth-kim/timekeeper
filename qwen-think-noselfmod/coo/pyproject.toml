[project]
name = "timekeeper-coo"
version = "0.1.0"
description = "Timekeeper COO — persistent agent loop"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.27",
    "tomli>=2.0",
    "structlog>=24.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
